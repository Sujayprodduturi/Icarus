<rect x="50" y="330" width="366" height="428" rx="20" fill="#fff" stroke="#9dc0d5" stroke-width="2" filter="url(#shadow)"/><path d="M70 330H396A20 20 0 0 1 416 350V387H50V350A20 20 0 0 1 70 330" fill="#d8eef5"/><text x="73" y="366" class="h">A · Contract / BUILT</text><text x="75" y="421" class="label">Step 4 record contract</text><text x="75" y="456" class="body">• one immutable signal ID</text><text x="75" y="489" class="body">• typed Trade or Skip record</text><text x="75" y="522" class="body">• partial-exit fragments</text><text x="75" y="555" class="body">• stale-mark provenance</text><path d="M74 582H392" stroke="#dce6ef"/><text x="75" y="618" class="label">Step 5 simulator adds</text><text x="75" y="651" class="body">Every emitted 1 maps to exactly</text><text x="75" y="676" class="body">one of those two outcomes.</text><rect x="74" y="708" width="160" height="25" rx="12" fill="#dff4ec"/><text x="88" y="726" class="tag">BUILT &amp; TESTED</text>
<rect x="468" y="330" width="664" height="428" rx="20" fill="#fff" stroke="#9fc9b8" stroke-width="2" filter="url(#shadow)"/><path d="M488 330H1112A20 20 0 0 1 1132 350V387H468V350A20 20 0 0 1 488 330" fill="#dcf2e8"/><text x="491" y="366" class="h">B · Signal simulator / BUILT</text><text x="492" y="420" class="label">One position per symbol · no portfolio cash or slots</text><rect x="492" y="448" width="616" height="78" rx="14" fill="#f5f8fc"/><text x="509" y="477" class="label">Decision is not a fill</text><text x="509" y="502" class="body">No next bar / not tradable / already open / invalid stop / no fill / zero shares</text><path d="M800 526V552M640 577H960M640 577V596M960 577V596" stroke="#92a7bf" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="493" y="596" width="300" height="114" rx="15" fill="#e4f5ed"/><text x="513" y="627" class="label">TRADE</text><text x="513" y="653" class="body">entry + filled exit fragments</text><text x="513" y="679" class="tiny">net of execution costs, before tax</text><rect x="807" y="596" width="300" height="114" rx="15" fill="#e8f0fb"/><text x="827" y="627" class="label">SKIP</text><text x="827" y="653" class="body">explicit reason + original signal ID</text><text x="827" y="679" class="tiny">never silently disappears</text><text x="492" y="738" class="tiny">Partial exits, dark bars, stale marks and final-bar residuals reconcile by test.</text>
<rect x="1184" y="330" width="366" height="428" rx="20" fill="#fff" stroke="#c5d5e5" stroke-width="2" filter="url(#shadow)"/><path d="M1204 330H1530A20 20 0 0 1 1550 350V387H1184V350A20 20 0 0 1 1204 330" fill="#e2eaf5"/><text x="1207" y="366" class="h">C · Evidence / PLANNED</text><text x="1208" y="421" class="label">Still to connect</text><text x="1208" y="456" class="body">5b: portfolio discard reasons</text><text x="1208" y="489" class="body">6: uncertainty / effective N</text><text x="1208" y="522" class="body">7–9: ledger, folds, report</text><path d="M1207 549H1526" stroke="#dce6ef"/><text x="1208" y="585" class="label">Still unavailable</text><text x="1208" y="618" class="body">No benchmark alpha at intraday exit</text><text x="1208" y="651" class="body">No portfolio return or promotion</text><text x="1208" y="684" class="body">No real-data evaluation</text><rect x="1207" y="708" width="166" height="25" rx="12" fill="#e5effb"/><text x="1221" y="726" class="tag">DIAGNOSTIC ONLY</text>
<rect x="50" y="782" width="1500" height="114" rx="18" fill="#152944"/><text x="76" y="818" class="h white">FAIL-CLOSED RAIL</text><text x="302" y="818" class="body white">Unlabelled NaN or invalid signal → reject · execution on decision bar → reject · schema drift → halt</text><text x="76" y="857" class="body white">Resting limit touched but not traded through → no assumed fill · every diagnostic stays outside the live order path</text><text x="76" y="930" class="tiny">STATUS KEY  ·  BUILT = implemented and tested  ·  PLANNED = downstream diagnostic work</text><text x="1370" y="930" class="tiny">Snapshot · see docs/STATE.md</text></svg>
