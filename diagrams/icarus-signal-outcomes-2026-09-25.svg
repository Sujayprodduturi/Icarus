<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">Icarus Task 3a — every emitted signal has one recorded outcome</title><desc id="desc">Decision-to-outcome flow with completed typed records and synthetic signal simulator, trade and skip branches, failure guards, and diagnostic-only accounting.</desc><defs><style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#14253f}.title{font-size:40px;font-weight:800;fill:#fff}.sub{font-size:19px;fill:#b9c9df}.h{font-size:21px;font-weight:750}.label{font-size:17px;font-weight:700}.body{font-size:14px;fill:#42516b}.tiny{font-size:12px;fill:#60708b}.tag{font-size:12px;font-weight:800;letter-spacing:.8px}.white{fill:#fff}</style><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#143055" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#92a7bf"/></marker></defs>
<rect width="1600" height="960" fill="#edf3f9"/><rect width="1600" height="156" fill="#101f38"/><rect x="72" y="36" width="244" height="30" rx="15" fill="#195370"/><text x="88" y="57" class="tag white">TASK 3A · SIGNAL TEST</text><text x="72" y="112" class="title">02 / One signal, one outcome</text><text x="1138" y="86" class="sub">What Step 5 now records · 25 Sep 2026</text>
