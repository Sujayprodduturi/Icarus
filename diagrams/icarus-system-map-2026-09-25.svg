<rect x="72" y="592" width="1456" height="32" rx="10" fill="#e9f0f8"/><text x="88" y="614" class="label">SAFETY BOUNDARY</text><text x="284" y="614" class="body">Research output can become evidence—not an order. A versioned registry and numeric promotion gate are the only future bridge.</text>
<rect x="48" y="672" width="725" height="202" rx="20" fill="#fff" stroke="#b7c9db" stroke-dasharray="8 7" stroke-width="2"/><rect x="70" y="690" width="92" height="25" rx="12" fill="#e5effb"/><text x="85" y="707" class="tag">FUTURE</text><text x="178" y="710" class="h">Phase 3 · learning loop</text><text x="72" y="756" class="body">Trade lineage → diagnose entries, exits &amp; execution timing</text><text x="72" y="782" class="body">Propose one versioned strategy change → rerun validation</text><text x="72" y="824" class="tiny">Never edits risk limits or promotes itself. No broker access.</text>
