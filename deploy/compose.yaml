# Local + Hermes datastores for Icarus (PRD §18, §21).
# Postgres = state/audit source of truth; Valkey = bus + HALT flag (BSD-3, prefer over Redis).
# Dev creds only — real deploy uses a secrets manager, never these defaults.
name: icarus

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: icarus
      POSTGRES_PASSWORD: icarus
      POSTGRES_DB: icarus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icarus"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--appendonly", "yes"]  # AOF persistence for the durable bus
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  valkeydata:
