# goal.yaml — Icarus single source of truth for objectives, thresholds, and hard limits.
#
# Merged from PRD §15 (Part I) + §39.3 (Part II v2). Per the PRD's own rule, the §39.3
# additions WIN on any conflict. Every number here is a starting value the operator tunes,
# NOT a law of physics — but the risk/compliance limits are enforced in CODE and cannot be
# overridden by any strategy or the learning loop (CLAUDE.md §0 invariant #4).
#
# All risk-related logic reads from this file; nothing risk-related is hard-coded (CLAUDE.md §2).

# ⚠️ THRESHOLDS, NOT A GATE. Only `min_sharpe` is read by anything. Sortino, Calmar and
# profit factor are *computed* by engine/metrics.py and compared against nothing; the rest
# (min_rr, min_trades_oos, oos_decay_max, cost_stress_multiplier, dsr_confidence,
# target_return_30d) are neither computed nor compared. The block a reader is most likely to
# mistake for the live gate is this one — the live gate is `stop_gate:` below, and it currently
# tests three things. Marked 2026-08-16 (finding F37); wiring them is steps 4c and 1.9.
objective:
  account_currency: INR
  target_return_30d: 0.05          # success bar (operator-set; aspirational, not a guarantee)
  max_drawdown: 0.08               # strategy-level failure bar used by the gate. NOTE this is
                                   # deliberately tight and is TIED TO the -10% live kill-switch:
                                   # a strategy whose own backtest drawdown is 25% would trip
                                   # risk.max_drawdown_killswitch almost immediately and is
                                   # therefore unrunnable regardless of its Sharpe.
  min_sharpe: 1.0                  # RESOLVED 2026-08-02 (O8) — see min_sharpe_amendments below.
  # The live value above must always equal the LAST entry here; the loader asserts it. This is
  # how O8 stays changeable (operator requirement, 2026-08-02) without becoming deniable.
  #
  # Invariant #25 says the gate is not renegotiated after results are seen. It does NOT say the
  # number can never move — it says a number that moves must not be able to pretend it was always
  # there. So changing min_sharpe is permitted at any time, and every change is a dated, reasoned,
  # append-only record. The one piece of friction: an amendment made once results exist must set
  # `acknowledged_post_hoc: true`, which the loader requires. You can still lower the bar after
  # seeing a bad metric sheet — but you cannot do it without signing your name to the fact.
  min_sharpe_amendments:
    - value: 1.3
      set_on: 2026-07-28
      results_existed: false
      reason: >
        Initial figure, carried from the PRD objective table. Flagged OPEN (O8) on 2026-08-01:
        1.3 net of cost and tax on daily-bar retail equity is at the ceiling of what systematic
        equity sustains anywhere, and a bar nobody can clear is a veto rather than a bar.
    - value: 1.0
      set_on: 2026-08-02
      results_existed: false
      reason: >
        Operator decision, before any backtest existed. 0.70 was proposed and REJECTED as
        unreachable-by-construction: stop_gate.require_sharpe_lower_bound_above already implies a
        point Sharpe of ~0.95 over the 3.0-year minimum OOS window, because the standard error of
        an annualised Sharpe over T years is ~sqrt(1/T) and the 95% one-sided bound therefore
        needs S > 1.645/sqrt(T) (T=3.0 -> 0.95; T=3.6, the actual lockbox -> 0.87; T=12, the
        walk-forward window -> 0.48). Any figure below that floor is a knob wired to nothing, and
        a gate that cannot fail anything is the exact flaw the 2026-07-31 council review found.
        1.0 sits just above the floor at the minimum window, so min_sharpe and the lower-bound
        gate agree instead of one silently dominating the other. It is ~2x Nifty buy-and-hold
        after cost and tax, and being wrong is cheap: anything promoted starts at canary size.
  min_sortino: 1.5
  min_calmar: 1.0
  min_profit_factor: 1.3
  min_trades_oos: 100              # was 30 (2026-08-01). Sharpe from 30 trades is mostly noise;
                                   # at 100 the error bars narrow enough to act on. See
                                   # stop_gate.trade_count_tiers for the NEEDS_MORE_DATA band.
  min_rr: 1.2
  oos_decay_max: 0.40              # OOS Sharpe >= 0.6 x IS. (0.50 was proposed and REJECTED as a
                                   # loosening — never widen a pre-existing bar.)
  cost_stress_multiplier: 1.5
  dsr_confidence: 0.95

# --------------------------------------------------------------------------------------
# THE PRE-REGISTERED PHASE-1 STOP GATE.
#
# Agreed by the operator on 2026-08-01, BEFORE any backtest, any metric sheet, or any result
# existed. That timing is the entire point and is what gives these numbers their force.
#
# An LLM council reviewed the plan on 2026-07-31 and all five advisors independently reached
# the same verdict: the stop gate was not a gate. TASKS.md specified a DELIVERABLE ("produce a
# metric sheet and pause"), not a THRESHOLD — it was the only task in the file with no
# acceptance criteria, and it could not be failed. This block is the fix.
#
# THE RULE THAT MATTERS (operator decision, 2026-08-01): a strategy that fails this gate does
# not receive money, and THE GATE IS NOT RENEGOTIATED AFTER THE RESULTS ARE SEEN. If every
# candidate fails, the response is to change the INPUT — intraday data, a different strategy
# class, the India-specific feeds — never to lower the bar. The project continues; the
# standard does not move.
#
# Editing any number below after a metric sheet exists converts this file from a commitment
# into a rationalisation. If it must change, record why, when, and what was already known.
# --------------------------------------------------------------------------------------
stop_gate:
  pre_registered_on: 2026-08-01
  # Sharpe is gated on the LOWER CONFIDENCE BOUND, not the point estimate: from ~100 trades a
  # measured 0.9 might really be anywhere in 0.1-1.7, so gating the point estimate gates luck.
  require_sharpe_lower_bound_above: 0.0
  # `pre_registered_on` above says WHEN this gate was set; these logs say what each judgement
  # threshold has ever BEEN. Added 2026-08-16 (finding F36): the date was asserted immutable while
  # the numbers under it stayed freely editable, so lowering this bound to -5.0 loaded cleanly and
  # the block still claimed a 2026-08-01 provenance. Same append-only mechanism as
  # objective.min_sharpe -- the loader asserts the live value equals the newest entry, entries are
  # chronological, and an amendment made once results exist must set acknowledged_post_hoc: true.
  # Only the two thresholds that are judgement rather than statute carry a log; the kill-switches
  # and the tax rates are bounded in code instead, because those have an external authority.
  require_sharpe_lower_bound_above_amendments:
    - value: 0.0
      set_on: 2026-08-01
      results_existed: false
      reason: >
        Pre-registered with the rest of the gate, before any backtest existed. Zero is the
        weakest defensible bar: the 95% lower bound on the Sharpe must clear zero, i.e. the
        evidence must rule out "this strategy loses money". Log added 2026-08-16; the value has
        not moved since it was set.
  sharpe_confidence_level: 0.95
  net_of_cost_and_tax: true        # ⚠️ ASSERTED, NOT ENFORCED — see finding F38. Nothing reads it:
                                   # the gate checks Sharpe/trades/expectancy off an equity curve
                                   # that is net of COSTS only. Wiring it is an open decision.
  max_pbo: 0.50                    # above 0.5 the "best" strategy is a coin flip out-of-sample
  max_pbo_amendments:
    - value: 0.50
      set_on: 2026-08-01
      results_existed: false
      reason: >
        Pre-registered with the rest of the gate. Above 0.5 the backtest-best strategy is worse
        than a coin flip out of sample, which is the definition PBO exists to express, so the
        threshold is the concept's own boundary rather than a tuned number. Log added 2026-08-16.
  # Trade-count tiers. NEEDS_MORE_DATA is a real verdict, not a soft failure — it must never
  # silently become PROMOTED.
  trade_count_promote: 100
  trade_count_needs_more_data: 30  # 30-99 -> NEEDS_MORE_DATA; <30 -> REJECTED
  # A strategy that has never seen a bad regime has not been tested. Verified 2026-08-01 against
  # NIFTY 50: the lockbox window below contains TWO drawdowns >=15% (Sep-24->Mar-25 at 15.8%,
  # and Jan-26->Mar-26 at 15.2%, unrecovered).
  min_oos_calendar_years: 3.0
  require_benchmark_drawdown_pct: 0.15
  # Tax stress. The crypto VDA scenario already existed; the equity one is new (2026-08-01) —
  # peer review caught that we stress-tested one tax reading and not the other.
  require_crypto_vda_stress: true
  require_equity_business_income_stress: true

# Point-in-time data split (operator decision, 2026-08-01). Fixed here so it cannot drift.
#
# THE LOCKBOX IS CONSUMED EXACTLY ONCE. All development, tuning and iteration happens on the
# walk-forward window. The moment the lockbox is used twice it is training data and any result
# from it means nothing. This is the real price of getting a verdict in 2026 instead of 2027.
data_split:
  walk_forward_start: 2011-01-01
  walk_forward_end: 2022-12-31     # ~12 years: develop, tune and iterate freely here
  lockbox_start: 2023-01-01        # ~3.5 years / 882 sessions, two >=15% drawdowns
  lockbox_end: null                # open-ended: "everything after lockbox_start"
  lockbox_uses_allowed: 1

# Walk-forward window shape (task 1.7, PRE-REGISTERED 2026-08-05, before any backtest ran).
# Pre-registered for the same reason the stop gate is: window shape changes results, so choosing
# it after seeing a number is choosing the number. The loader asserts `registered` has not moved.
backtest:
  registered: 2026-08-05
  # ANCHORED, not rolling: training starts at walk_forward_start and expands. A fixed-length
  # window would drop 2011-2013 as the sample advances, and those years carry the taper-tantrum
  # and demonetisation regimes -- exactly the conditions a strategy most needs to have survived.
  min_train_years: 3.0             # first test window opens 2014; ~9 out-of-sample years follow
  test_window_years: 1.0
  step_years: 1.0
  # Sessions left empty between the end of training and the start of each test window. ONE
  # constant, the same for every strategy.
  #
  # Renamed from `embargo_sessions` and made the whole gap on 2026-08-17 (finding F40, operator
  # decision). It used to be added to a per-strategy purge of `longest_lookback(strategy)`. Two
  # things were wrong with that:
  #
  #   1. Purging exists to stop a FITTED model learning from observations whose labels overlap the
  #      test set. Nothing here is fitted per fold -- strategies are pre-registered with fixed
  #      parameters, the in-sample record is measured rather than optimised against, and each span
  #      is simulated from a fresh book. No state crosses from train to test, so there is nothing
  #      for a purge to cut. The purge's own stated reason ("a 252-day average on the first test
  #      day is built from training bars") was made void by whole-span evaluation in task 2f -- and
  #      was never a leak anyway, because reading history you would genuinely have had is what a
  #      live system does every morning.
  #   2. Sizing it per strategy made the folds differ per strategy: baseline_buy_and_hold ran 7
  #      folds from ~2015 while xs_momentum_20 ran 8 from ~2014, and the sheet compared them
  #      directly. A control measured over a different period from the strategy it controls for
  #      cannot establish alpha, which invariant #21 gates on (findings F16, F31).
  #
  # THE VALUE IS UNCHANGED. 5 was set before any backtest result existed and is not being retuned
  # now that results exist (invariant #25). What changed is the structure, not the number.
  #
  # NOT ENFORCED, and deliberately: the textbook embargo -- excluding each earlier test window
  # (plus a tail) from every later fold's training, which an anchored window otherwise swallows
  # whole -- is not implemented. It buys nothing while nothing is fitted. It becomes REQUIRED the
  # day the Strategy-Inventor starts fitting parameters per fold in Phase 2, together with a real
  # purge. Do not enable per-fold fitting without building both.
  seam_sessions: 5
  starting_equity_inr: 100000      # the sim's book size; NOT the live seed tier (that is Phase 2)
  # Added 2026-08-14 (task 2c, finding F4). Before this, a position whose symbol stopped printing
  # bars was carried forever: never closed, never counted, its capital neither lost nor gained,
  # and its slot held for the rest of the fold. Measured on the current panel: 71 times a symbol
  # is tradable one session and dark the next, 53 of those staying dark 60+ sessions, one for
  # 2,840. 20 sessions is about a calendar month -- long enough that an ordinary trading halt
  # resolves, short enough that a delisting does not hold a seat for years.
  #
  # This number carries its OWN dated log rather than riding on `registered: 2026-08-05` above.
  # The first draft argued it was safe to sit inside the registered block because neither
  # direction flatters a result. That was wrong: writing a dead holding off sooner frees a slot
  # sooner, and in a book that discards 94-99.99% of its signals for want of a slot, that changes
  # which later signals are taken. It is result-affecting and editable, which is precisely the
  # shape invariant #25 covers -- so it gets the same append-only treatment as min_sharpe, and
  # cannot borrow a provenance from a date that predates it. The loader asserts the live value
  # equals the newest entry.
  stale_position_sessions: 20
  stale_position_sessions_amendments:
    - value: 20
      set_on: 2026-08-14
      results_existed: true
      acknowledged_post_hoc: true
      reason: >
        Introduced with the fix itself (task 2c, finding F4), after the 2026-08-07 backtest
        existed -- hence acknowledged_post_hoc. It is not a loosening: before this the threshold
        was effectively infinite and a dead holding was never written off at all, so any finite
        value is stricter than what it replaced. 20 sessions ~ one calendar month, chosen so an
        ordinary trading halt is carried through rather than closed at a price nobody could have
        got, while a delisting does not hold one of four slots for the rest of the fold.

# ⚠️ NOT ENFORCED — every key in this block is declared and read by no code as of 2026-08-16.
# The Inventor and the reflection loop are Phase 2 (TASKS.md 2.5-2.7).
# Kept rather than deleted: the decision is real and losing it would cost more than
# the noise. Marked because a reader cannot otherwise tell a promise from a fact
# (finding F37).
learning:
  reflection_every_trades: 15      # seed: per-strategy (5 was statistical noise; BUILD_MAP M3)
  one_change_per_cycle: true
  invention_enabled: true          # grammar-constrained (DSL only)
  inventor_model: claude-sonnet-4-6
  inventor_model_hard: claude-opus-4-8
  sentiment_model: claude-haiku-4-5

risk:                              # DECIDED VALUES (see PRD §14 for rationale)
  per_trade_risk_r: 0.005          # 0.5% equity at risk per trade (proven strategy), tier-scaled
  new_strategy_size_factor: 0.25   # canary runs at 25% -> ~0.125% effective
  kelly_fraction_cap: 0.5          # never exceed half-Kelly; Kelly only reduces size
  daily_loss_limit: 0.03           # -3% equity -> halt new entries for the day
  daily_derisk_trigger: 0.015      # -1.5% -> halve all sizing
  max_drawdown_killswitch: 0.10    # -10% peak-to-trough -> full stop, operator-only restart
  max_open_positions: 4            # 3 -> 4 (operator, 2026-08-01). DERIVED, not chosen: the heat
                                   # cap alone permits max_portfolio_heat / per_trade_risk_r
                                   # = 2% / 0.5% = 4. The old 3 was stricter than the risk limit
                                   # required and cost 33% of the evidence-gathering rate for
                                   # nothing. NO risk limit was loosened to make this change.
                                   # Known wart: with a fixed count AND a heat cap the two can
                                   # disagree (3 proven at 0.5% + 4 canaries at 0.125% is also
                                   # exactly 2%). The heat cap is the real control; deriving the
                                   # count from it is a later refactor (BUILD_MAP M6).
  max_portfolio_heat: 0.02
  max_pairwise_correlation: 0.7
  consecutive_loss_pause: 3        # consecutive losses on a strategy -> pause + revalidate
  canary_min_trades: 10
  canary_min_days: 7
  # STAGNATION HALT (invariant #23, added 2026-08-01). Every other kill-switch above fires on a
  # FAST loss. Nothing fired on a slow, perfectly-compliant bleed to zero — which the PRD itself
  # (§23) calls the most likely outcome. This is the flatness trigger, not a drawdown trigger.
  stagnation_check_after_trades: 50
  stagnation_requires_positive_net: true   # cumulative net-of-cost-and-tax P&L must be > 0
  stagnation_ci_level: 0.95                # ...and the CI on mean R must exclude zero
  cost_hurdle_multiplier: 1.5
  crypto_max_leverage_hard: 2.0    # HARD ceiling, never loosens with tier (invariant #7)
  crypto_max_leverage_seed: 1.0    # seed tier effective cap until proven

compliance:
  max_orders_per_sec: 2
  max_orders_per_min: 20
  max_orders_per_day: 200
  white_box_only: true
  static_ip_required: true
  limit_orders_only: true          # NSE bars market orders via algo (invariant #5)
  algo_id_tagging_required: true

# Tax (task 1.6, PRD §6). Tax is ANNUAL and applies to the aggregate, not per trade: the bill
# depends on the whole financial year (1 Apr - 31 Mar IST), so the model consumes a ledger of
# closed trades and returns a per-year bill.
#
# SOURCES, all re-verified 2026-07-30 (FY 2026-27 is the FIRST year under the new Income-tax Act,
# 2025, so section numbers changed — speculative business moved from s.43(5) of the 1961 Act to
# s.66 of the 2025 Act; VDA provisions still cited as s.115BBH in current commentary):
#   * STCG listed equity w/ STT 20% (raised from 15% on 23 Jul 2024); LTCG 12.5% above Rs 1.25L,
#     12-month holding, no indexation. Budget 2026 changed NEITHER for FY 2026-27.
#   * Slabs unchanged for FY 2026-27; top marginal 30% above Rs 24L.
#   * Health & education cess 4% on the tax amount — unchanged since FY 2018-19.
#   * VDA: flat 30%, no deduction but cost of acquisition, NO set-off of any loss.
tax:
  # -- Settled law. These are NOT preferences; the loader asserts them so a bad edit cannot
  # -- quietly reclassify income into a cheaper bucket than the statute allows.
  equity_intraday: speculative_business          # s.66 (was s.43(5)) — settled
  equity_fno: nonspeculative_business            # recognised-stock-exchange carve-out — settled
  crypto_inr_derivatives: speculative_business   # DEFAULT (contested — PRD §6.2)
  crypto_reclassification_stress: vda_30_flat    # gate stress scenario

  # -- The one genuine choice (PRD §6.1 marks delivery "per classification"): is systematic
  # -- delivery trading a business, or investing? A CA question. OPERATOR DECISION (31 Jul 2026):
  # -- capital gains. Icarus places the same delivery trades the operator would have placed
  # -- personally; automating the execution of one's own investment decisions does not by itself
  # -- convert investing into a business. Note this is the CHEAPER of the two readings (20% STCG /
  # -- 12.5% LTCG vs a 30% slab), so unlike the rest of this block it does NOT err against us —
  # -- operator item O7 (CA confirmation) stays open, and holding period + trade frequency, not
  # -- the fact that software presses the button, are what a CA will actually look at.
  equity_delivery: capital_gains                 # or: nonspeculative_business

  operator_slab_rate: 0.30         # MARGINAL rate, excl. cess. Trading income sits on top of the
                                   # operator's other income, so the marginal rate is what an extra
                                   # rupee actually costs — a slab computation from zero would give
                                   # the average rate and UNDERSTATE the tax.
  cess_rate: 0.04                  # health & education cess, applied to the tax amount
  stcg_rate: 0.20                  # s.111A equivalent, listed equity with STT
  ltcg_rate: 0.125                 # s.112A equivalent
  ltcg_exemption_inr: 125000       # PER TAXPAYER PER YEAR across ALL equity holdings — not per
                                   # strategy. Reduce this if other investments already consume it;
                                   # a backtest cannot know, so it must not be assumed free.
  ltcg_holding_months: 12          # above this, delivery gains are long-term
  vda_flat_rate: 0.30              # stress scenario only; no offsets, no carry-forward

  # Loss carry-forward, in years, per bucket. VDA is deliberately absent: VDA losses cannot be
  # carried forward at all, and modelling that as "0 years" is the point, not an omission.
  carry_forward_years_speculative: 4
  carry_forward_years_nonspeculative: 8
  carry_forward_years_capital: 8

# --------------------------------------------------------------------------------------
# v2 additions (PRD §39.3) — these WIN on conflict with the blocks above.
# --------------------------------------------------------------------------------------
# ⚠️ NOT ENFORCED — every key in this block is declared and read by no code as of 2026-08-16.
# Read by the data agents' own constants today, not from here; reconciling the two is task 2e's leftover.
# Kept rather than deleted: the decision is real and losing it would cost more than
# the noise. Marked because a reader cannot otherwise tell a promise from a fact
# (finding F37).
data:
  timezone_storage: UTC
  equity_session: NSE
  point_in_time_universe: true
  survivorship_control: true               # PIT universe; penny/SME universe banned (§29.2)
  corporate_action_adjust: back_adjust     # splits/bonus/rights; dividend convention fixed
  data_quality_gate: true
  min_oos_calendar_span_days: 250          # >= ~1 stress episode; weight daily+ evidence

# Data-QA layer (task 1.1b, PRD §29.3-29.4). Bad bars are REJECTED, never winsorized:
# clamping a suspicious price invents one that never traded. A rejection leaves an honest
# hole that min_day_score accounts for.
data_quality:
  atr_window: 14                           # bars of history before the jump test may fire
  max_bar_move_atr: 8.0                    # move > N x the symbol's own ATR -> probable bad tick
  max_single_bar_move: 0.5                 # |return| > 50% -> probable unadjusted action (§29.3)
  min_day_score: 0.98                      # per-day accepted-share below this -> NEEDS_MORE_DATA
  stale_sessions_symbol_veto: 2            # no bar for N expected sessions -> veto that symbol (§37)
  stale_plane_halt_ratio: 0.5              # this share of a plane's feeds stale -> venue dead -> halt (§29.4)
  #
  # WHERE EACH KEY ABOVE IS ENFORCED (audited 2026-08-10; see docs/reviews/2026-08-09-*-audit.md).
  # Every key is either enforced somewhere or says here why it is not — a reader must never have
  # to guess whether a threshold does anything.
  #   atr_window, max_bar_move_atr  -> LIVE: agents/data/quality.py  ·  PANEL: engine/panelbuild.py
  #                                    `_reject_bad_ticks`. Both planes, one meaning.
  #   max_single_bar_move           -> LIVE only. In the panel this is SUPERSEDED by
  #                                    panelbuild.MAX_UNEXPLAINED_GAP (0.25), which is tighter than
  #                                    0.50 and truncates the symbol's history rather than dropping
  #                                    one bar. Applying both would be worse than either: blanking
  #                                    the bar makes its neighbours non-consecutive, and the gap
  #                                    audit deliberately does not compare across holes — so the
  #                                    discontinuity would vanish and nothing would be quarantined.
  #   min_day_score                 -> REPORTED, not enforced, in both planes. §29.4 makes a low
  #                                    score a NEEDS_MORE_DATA verdict at the validation gate; a
  #                                    data layer that silently deleted a whole session instead
  #                                    would hide the very thing the score exists to surface.
  #   stale_sessions_symbol_veto    -> LIVE: enforced. PANEL: already implied and STRICTER — the
  #                                    universe rule requires presence in EVERY session of the
  #                                    `universe.turnover_window_sessions` window, so one missing
  #                                    day blanks membership for 20 sessions, not 2. A separate
  #                                    check here would be dead code that looked load-bearing.
  #   stale_plane_halt_ratio        -> LIVE only, and necessarily: "the venue is down" is not a
  #                                    statement a historical backfill can make.

# Tradable equity universe (task 1.1c, PRD §29.1-29.3). Point-in-time: a name qualifies on a
# date using only data available on that date. Bhavcopy series EQ already excludes BE/BZ, which
# is how NSE marks trade-to-trade and surveillance names, so §29.2's "non-surveillance" filter
# holds by construction. NSE's F&O and equity master lists are deliberately NOT used as filters:
# they are today's snapshots, and applying them to past dates is look-ahead (§29.1).
universe:
  min_avg_turnover_inr: 500000000          # Rs 50cr, 20-session average — honest-fill floor
  turnover_window_sessions: 20
  min_close_inr: 30                        # penny ban (§29.2), low enough to size at seed capital
  dividend_convention: price_return        # §29.3 — ONE convention in signal, cost and tax
  history_years: 5

# Cost schedule (task 1.5, PRD §7). Statutory + broker charges ONLY — slippage and fill
# probability live in the execution/fill model (§30.1, task 1.7b), so friction is never
# double-counted. Rates live here rather than in code because they change by circular and
# Appendix B requires re-pulling them, not hard-coding (CLAUDE.md §2).
#
# SOURCES, all re-verified 2026-07-29:
#   * Rates: zerodha.com/charges (the broker that actually debits us) — cross-checked against
#     PRD §7.1, which they match including the post-1-Apr-2026 STT hikes (futures 0.05% sell,
#     options 0.15% on premium).
#   * NSE cash txn charge / IPFT convention: NSE circular 27 Feb 2026, effective 1 Mar 2026,
#     rolled IPFT back to Rs 0.01/crore with transaction charges raised correspondingly and
#     "no change in the overall outflow". This RESOLVES the Appendix-B open item:
#         pre-Mar-2026:  0.00297%     + Rs 10/crore IPFT (=0.0001%)      = 0.00307%
#         post-Mar-2026: 0.00307%     + Rs 0.01/crore IPFT (~0.0000001%) = 0.00307%
#     Same total, split differently. So: use the all-in 0.00307% and DO NOT add IPFT as a
#     separate line — at Rs 0.01/crore it is Rs 0.0001 on a Rs 1 lakh trade. A page still
#     showing "0.00297% + Rs 10/crore IPFT" is quoting the pre-March split, not a cheaper rate.
#   * Residual uncertainty: the NSE circular PDFs would not extract (one timed out, one is
#     image-encoded). Relied on a circular summary plus Zerodha's live page — independent and
#     arithmetically consistent. Re-pull the primary before live capital (Appendix B).
costs:
  gst_rate: 0.18                           # on (brokerage + exchange txn + SEBI fee) only —
                                           # never on STT, stamp duty, or the GST-inclusive DP fee
  sebi_turnover_pct: 0.000001              # Rs 10/crore, both sides, all segments
  dp_charge_inr: 15.34                     # per scrip per day on a DELIVERY SELL. Rs 3.5 CDSL +
                                           # Rs 9.5 Zerodha + Rs 2.34 GST — ALREADY GST-inclusive.
                                           # Fixed rupees, so it dominates below ~Rs 10k notional:
                                           # this single line is most of the seed-tier C1 problem.
  # DELIBERATELY ABSENT: the Kite Connect Rs 500/mo subscription. PRD §7.1 suggests amortizing it
  # into the per-strategy hurdle; the operator decided (2026-07-30) to treat it as a capital
  # investment in the business instead — the same bucket as the PC, not a cost of a trade.
  # Rationale: it is fixed and independent of whether Icarus trades at all, so charging it against
  # a strategy's edge makes every per-trade number depend on an assumed monthly trade count.
  # CONSEQUENCE, stated so it is not lost: strategy metrics are therefore *before* infrastructure
  # cost. The cash still leaves the account — it is tracked in BUILD_MAP §5 (operating cost) and
  # must appear as its own line in the daily report and the Phase-1 metric sheet, never netted
  # silently into strategy P&L.
  segments:
    # brokerage = flat + min(pct x turnover, cap). Covers all three real shapes:
    # zero (delivery), lower-of (intraday/futures), flat-per-order (options).
    equity_delivery:
      brokerage_flat_inr: 0.0
      brokerage_pct: 0.0                   # Rs 0 — makes delivery the cheapest seed-tier path
      brokerage_cap_inr: 0.0
      stt_buy_pct: 0.001                   # 0.1% buy AND sell (unchanged Apr 2026)
      stt_sell_pct: 0.001
      exchange_txn_pct: 0.0000307          # 0.00307% all-in, incl. IPFT — see note above
      stamp_buy_pct: 0.00015               # 0.015%, buy side only
      dp_charge_on_sell: true              # the fixed-rupee killer at small size
    equity_intraday:
      brokerage_flat_inr: 0.0
      brokerage_pct: 0.0003                # 0.03% or Rs 20/order, whichever LOWER
      brokerage_cap_inr: 20.0
      stt_buy_pct: 0.0
      stt_sell_pct: 0.00025                # 0.025% sell only
      exchange_txn_pct: 0.0000307
      stamp_buy_pct: 0.00003               # 0.003%
      dp_charge_on_sell: false             # nothing leaves the demat account
    equity_futures:
      brokerage_flat_inr: 0.0
      brokerage_pct: 0.0003
      brokerage_cap_inr: 20.0
      stt_buy_pct: 0.0
      stt_sell_pct: 0.0005                 # 0.05% sell — RAISED 1 Apr 2026 (was 0.02%)
      exchange_txn_pct: 0.0000183          # 0.00183%
      stamp_buy_pct: 0.00002               # 0.002%
      dp_charge_on_sell: false
    equity_options:
      brokerage_flat_inr: 20.0             # flat Rs 20/executed order
      brokerage_pct: 0.0
      brokerage_cap_inr: 0.0
      stt_buy_pct: 0.0
      stt_sell_pct: 0.0015                 # 0.15% on PREMIUM, sell — RAISED 1 Apr 2026 (was 0.10%)
      exchange_txn_pct: 0.0003553          # 0.03553% on premium
      stamp_buy_pct: 0.00003               # 0.003%
      dp_charge_on_sell: false

execution_realism:
  fill_requires_trade_through: true        # touch != fill (invariant #12)
  queue_volume_multiple_k: 2.0             # bar vol must exceed k x order size to fill
  next_bar_execution: true                 # no same-bar look-ahead (invariant #13)
  latency_ms: 750                          # conservative decision->fill latency
  model_partial_fills: true
  max_participation_of_depth: 0.05         # capacity/impact cap (<=5%)
  # Spread paid by a marketable limit, per side, in basis points (task 1.7b, 2026-08-05).
  # ASSUMPTION, not a measurement: daily bhavcopy carries no bid/ask, so this cannot be derived
  # from the data and had to be chosen. 5bps is ~2-5x the quoted spread on the >=Rs 50cr-turnover
  # universe the liquidity floor admits, which is the direction to be wrong in. VERIFY against
  # real canary fills (PRD §30.5) and widen if live is worse -- never narrow it to fit a result.
  slippage_bps: 5.0
  tick_size_inr: 0.05                      # NSE equity tick; a fill price off-tick is not a price

# ⚠️ NOT ENFORCED — the overfitting guards are task 1.9 and none of this is read yet. The two
# exceptions are `benchmark_equity`, which the Panel uses, and `lockbox_rotation_days`, marked
# inline below. Marked 2026-08-16 (finding F37).
overfitting:
  lifetime_trial_ledger: true
  cumulative_effective_n: true
  haircut_method: BHY                      # Harvey-Liu multiple-testing
  gate_on_sharpe_lower_bound: true
  small_sample_shrinkage: true
  # DELETED 2026-08-16 (finding F37): `lockbox_eval_budget: 50`. It contradicted
  # data_split.lockbox_uses_allowed, which the loader hard-asserts to 1 because invariant #26
  # says the lockbox is consumed exactly once. Neither was wired to anything, and LockboxGuard
  # takes its allowance as an argument -- so whoever wired it would have reached for the more
  # plausible-sounding name, got 50, and the once-only guarantee would have gone while the
  # loader went on cheerfully asserting it. Two knobs for one number, disagreeing, is worse
  # than either. `lockbox_uses_allowed` is the survivor: it is the one with the assert.
  lockbox_rotation_days: 90        # ⚠️ NOT ENFORCED — read by no code (F37); Phase 2.
  benchmark_equity: NIFTY50
  benchmark_crypto: BTCINR
  min_alpha_after_cost_tax: 0.0
  max_benchmark_r2: 0.8

trade_quality:
  # ⚠️ NOT ENFORCED — declared 2026-07-30, still read by no code as of 2026-08-16 (finding F37).
  # Both remaining keys are real controls the PRD wants; they are kept because deleting them would
  # lose the decision, and marked because a reader cannot otherwise tell a promise from a fact.
  # They belong to the live Risk agent (task 2.1), not to the backtester.
  #
  # DELETED 2026-08-16: `min_quality_score: 0.6` and `rank_select_top_k: 1`. Those named a
  # per-signal "quality score" that has never existed anywhere in the codebase — not unimplemented,
  # unconceived. A NOT-ENFORCED marker would have preserved a promise nobody ever made; the honest
  # record of a thing we never built is its absence. Reinstate them with the scorer, if it is ever
  # designed.
  max_trades_per_day_per_strategy: 3
  min_holding_bars: 3

